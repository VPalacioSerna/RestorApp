<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">

    <div class="row">
        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <h5>Agendar Evento</h5>
                <div class="mb-3">
                    <label class="form-label">Tipo de Evento</label>
                    <select id="tipoEvento" class="form-select" onchange="actualizarFechaMinima()">
                        <option value="Reunión">Reunión (2 días antelación)</option>
                        <option value="Taller">Taller (7 días antelación)</option>
                        <option value="Concierto">Concierto (15 días antelación)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Fecha del Evento</label>
                    <input type="date" id="fechaEvento" class="form-select">
                </div>
                <button class="btn btn-primary w-100" onclick="agendarEvento()">Agendar</button>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card p-3 shadow-sm">
                <h5>Eventos Programados</h5>
                <ul id="listaEventos" class="list-group">
                    </ul>
            </div>
        </div>
    </div>

    <script src="eventos.js"></script>
</body>
</html>
