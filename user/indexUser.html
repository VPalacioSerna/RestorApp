<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user</title>
    <!--Link para bootstrap html-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Link para los iconos de Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body  class="d-flex flex-column min-vh-100 bg-light">
    <header>
        <!--Inicio de la barra de navegacion-->
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center text-dark" href="#">
                    <i class="fa-solid fa-utensils text-success me-3"></i>
                    RestorApp
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link text-dark px-3" aria-current="page" href="#">Menu</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-secondary px-3" href="#">My Orders</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-secondary px-3" href="./infoUser.html">Profile</a>
                        </li>   
                    </ul>
                    <button class="btn btn-sm bg-success bg-opacity-75 ms-md-5 d-flex align-items-center gap-2">
                        <a href="../login/login.html"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                        Log Out</a>
                    </button>
                </div>
            </div>
        </nav>
        <!--Fin de la barra de navegacion-->
    </header>

    <main class="flex-grow-1">
        <div class="container">
            <div class="row mt-4">
                <!--Our menu-->
                <div class="col-md-8">
                    <div class="d-flex flex-column flex-md-row justify-content-between ">
                        <h2>Our Menu</h2>
                        <div class="input-group" style="max-width: 300px;">
                            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" placeholder="Search food...">
                        </div>
                    </div>
                    <div class="d-flex gap-2 overflow-auto mt-2">
                        <button class="btn btn-dark rounded-pill px-4">All</button>
                        <button class="btn btn-outline-dark rounded-pill px-4">Burgers</button>
                        <button class="btn btn-outline-dark rounded-pill px-4">Sides</button>
                        <button class="btn btn-outline-dark rounded-pill px-4">Drinks</button>
                    </div>
                    <!--Cards de our menu-->
                    <div class="row g-4 mt-4">
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="card" >
                                <div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height: 180px;">
                                    <i class="fa-solid fa-image text-secondary fa-2x"></i>
                                    <!--Img card-->
                                </div>
                                <div class="card-body">
                                    <div class="d-flex align-items-center justify-content-between my-2">                                        
                                        <h5 class="card-title">Card title</h5>
                                        <span class="small fw-bold text-success">$8.99</span>
                                    </div>
                                    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
                                    <a href="#" class="btn btn-outline-secondary text-black w-100 m-auto"><i class="fa-solid fa-cart-shopping me-2"></i>Add to order</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--Your order-->
                <div class="col-12 col-md-4">
                    <div class="card rounded-4 p-3">
                        <div class="card-header d-flex justify-content-between bg-white">
                            <h5>Your Order <span class="badge bg-success rounded-circle"><!--n cantidad-->n</span></h5>
                            <a href="">Clear all</a>
                        </div>
                        <div class="card-body d-flex align-items-center mb-3 bg-white">
                            <div class="bg-light rounded-3 me-3" style="width: 50px; height: 50px;">
                                <!--Img "Your order"-->
                            </div>
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between">
                                    <h6 class="mb-0"><!--Nombre-->Classic Beef</h6>
                                    <span class="small fw-bold"><!--Precio-->$8.99</span>
                                </div>
                                <a href="" class="small text-danger">Remover</a>
                            </div>
                        </div>
                        <div class="card-footer mt-3 bg-white">
                            <div class="d-flex justify-content-between fw-bold my-3">
                                <span>Total</span>
                                <span class="text-success"><!--Suma-->$14.02</span>
                            </div>

                            <button class="btn btn-success w-100 py-2 rounded-4 fw-bold shadow-sm">
                                Confirm Order <i class="fa-solid fa-arrow-right ms-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
