<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user</title>
    <!--Link para guardian de login-->
    <script src="../JS/guard.js"></script>
    <script>
        verifyAccess('user');
    </script>
    <!--Link para bootstrap html-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Link para los iconos de Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body  class="d-flex flex-column min-vh-100 bg-light">
    <header >
        <!--Inicio de la barra de navegacion-->
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
            <div class="container ">
                <a class="navbar-brand d-flex align-items-center text-dark" href="./indexUser.html">
                    <i class="fa-solid fa-utensils text-success me-3"></i>
                    RestorApp
                </a>              
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse d-flex flex-row align-items-end" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link text-secondary px-3" href="./indexUser.html">Inicio</a>
                        </li>   
                    </ul>
                    <button class="btn btn-sm bg-success bg-opacity-75 ms-md-5 d-flex align-items-center gap-2">
                        <a href="../login/login.html" class="text-black text-decoration-none" onclick="btnLogOut()"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                        Log Out</a>
                    </button>
                </div>
            </div>
        </nav>
        <!--Fin de la barra de navegacion-->
    </header>

    <main class="flex-grow-1">
        <div class="container">
            <div class="row mt-4">
                <!--Our menu-->
                <div class="col-12 col-md-8 ">
                    <div class="d-flex flex-column flex-md-row justify-content-between ">
                        <h2>Our Menu</h2>
                    </div>
                    <!--Cards de our menu-->
                    <div class="cont-orders" id="orders-history-container">
                        <!--Aqui van las cards (en JS)-->                        
                    </div>                   
                    
                </div>
                
                <!--Inicio de Your Order-->
                <div class="col-12 col-lg-4">
                    <div class="card shadow-sm p-3 sticky-top mb-5">

                        <h4 class="fw-bold mb-4">Account Details</h4>
                        <div class="card-body text-center">
                            <div class="bg-light rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 80px; height: 80px;">
                                <i class="fa-solid fa-user text-secondary fs-2"></i>
                            </div>

                            <h5 id="user-name" class="fw-bold mb-0"></h5>
                            <p id="user-email" class="text-muted small"></p>
                            <span id="user-role" class="badge rounded-pill bg-success-subtle text-success border border-success-subtle px-3 py-2 mb-4">User</span>

                            <div class="row g-2 mb-4">
                                <div class="col-6">
                                    <div class="bg-light p-2 rounded text-start">
                                        <small class="text-uppercase text-muted fw-bold d-block">Orders</small>
                                        <span id="user-order-count" class="h4 fw-bold">0</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
                <!--Fin de Your Order-->
            </div>
        </div>
    </main>

    <script src="../JS/user.js  "></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
