<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!--Link para los iconos de Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <header>
        <!--Inicio de la barra de navegacion-->
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center text-dark" href="./indexAdmin.html">
                    <i class="fa-solid fa-utensils text-success me-3"></i>
                    RestorApp
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link text-secondary px-3" aria-current="page" href="./indexAdmin.html">Dashboard-Orders</a>
                        </li>
                    </ul>
                    <button class="btn btn-sm bg-success bg-opacity-50 fw-medium d-flex align-items-center gap-2">
                        <a href="../login/login.html" class="text-black text-decoration-none" onclick="btnLogOut()"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                        Log Out</a>
                    </button>
                </div>
            </div>
        </nav>
        <!--Fin de la barra de navegacion-->
    </header> 

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0">Gestión de Productos</h2>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="table-responsive card shadow-sm">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>       
                                <th>Id</th>                         
                                <th>Producto</th>
                                <th>Nombre</th>
                                <th>Descripcion</th>
                                <th>Precio</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbody" class="">
                            
                            <!-- <tr>
                                <td>id</td>
                                <td class="">img</td>
                                <td class="fw-bold">Burger Classico</td>
                                <td class="text-truncate" style="max-width: 150px;">Lorem ipsum dolor sit, amet consectetur adipisicing elit.</td>
                                <td>$12.00</td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-info">Detalles</button>
                                    <button class="btn btn-sm btn-outline-warning me-1">Editar</button>
                                    <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                                </td>
                            </tr> -->
                        </tbody>
                    </table>
                </div>  
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm p-4">
                    <h5 class="fw-bold mb-3" id="form-title">Producto</h5>
                    <span class="mb-4">(Agregar | Editar | Detalles)</span>
                    
                    <form id="product-form">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Img</label>
                            <input type="text" class="form-control" id="inputImg" placeholder="Img url">
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nombre</label>
                            <input type="text" class="form-control" id="inputName" placeholder="Pizza">
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Descripcion</label>
                            <input type="text" class="form-control" id="inputDescription" placeholder="Lorem ipsum dolor">
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Precio ($)</label>
                            <input type="number" class="form-control" id="inputPrice" placeholder="0.00">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success" id="guardarProducto">Guardar Producto</button>
                        </div>
                    </form>
                </div>
                
            </div>
        </div>
    </main>

    <script src="../JS/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</html>
